# Build di CAlcool.apk e pubblicazione nelle Release di GitHub.
#
# - Pull request: compila e allega l'APK come artifact (verifica della build).
# - Tag "v*" (es. v1.0.0): compila e pubblica la Release con CAlcool.apk allegato.
# - Avvio manuale (Actions → Build e Release → Run workflow) con "version" (es. v1.0.0):
#   compila main e pubblica la Release creando il tag su quel commit.
#   Il link https://github.com/andreagioiaa/CAlcool/releases/latest/download/CAlcool.apk
#   punta sempre all'ultima versione.
#
# Firma: se nei Secrets del repository ci sono ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS e ANDROID_KEY_PASSWORD, l'APK è firmato
# con quella chiave (stessa firma tra versioni = aggiornamenti installabili).
# Senza Secrets viene firmato con una chiave di debug generata a ogni build.
name: Build e Release

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione da pubblicare, es. v1.0.0 (vuoto = solo build)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Versione fissata a quella del progetto (.metadata): Flutter 3.50+ richiede
      # Gradle >= 9.3.1, mentre android/ usa ancora Gradle 8.14 e AGP 8.11.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true

      - name: Chiave di firma
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          cat > android/key.properties <<PROPS
          storeFile=release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS

      - name: Dipendenze
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk CAlcool.apk
          echo "CAlcool.apk: $(du -h CAlcool.apk | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Firma: chiave di debug (nessun Secret ANDROID_KEYSTORE_BASE64)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: CAlcool-android
          path: CAlcool.apk
          retention-days: 7

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          files: CAlcool.apk
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: CAlcool ${{ inputs.version || github.ref_name }}
          generate_release_notes: true
          body: |
            Installer per Android: scarica **CAlcool.apk** dal telefono e aprilo.
            Android chiederà di consentire l'installazione da questa origine ("origini sconosciute").
